# application.yml
server:
  tomcat:
    # 增加连接器缓冲区
    connection-timeout: 60000
    # 设置最大 HTTP 头大小
    max-http-header-size: 65536  # 64KB
    # 增加输出缓冲区
    threads:
      max: 200
      min-spare: 10
    # 增加接受队列大小
    accept-count: 200
    max-http-form-post-size: 104857600
  # 增加 Servlet 缓冲区
  servlet:
    buffer-size: 65536  # 64KB，默认8KB
  port: 8081

spring:
  application:
    name: seata-namingserver
logging:
  config: classpath:logback-spring.xml
  file:
    path: ${log.home:${user.home}/logs/seata}
heartbeat:
  threshold: 90000
  period: 60000
console:
  user:
    password: seata
    username: seata
seata:
  security:
    secretKey: SeataSecretKey0c382ef121d778043159209298fd40bf3850a017
    tokenValidityInMilliseconds: 1800000
    csrf-ignore-urls: /naming/v1/**,/api/v1/naming/**
    ignore:
      urls: /,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.jpeg,/**/*.ico,/api/v1/auth/login,/version.json,/naming/v1/health,/error

  # MCP Server Configuration
  mcp:
    # Server name (do not set the default to seata-mcp-server)
    serverName: test-mcp
    serverVersion: 2.0.0
    mcpType: streamable
#    sse:
#      # SSE endpoint (no default/SSE set)
#      sseEndpoint: /sse
#      # message endpoint (no default /message set)
#      messageEndpoint: /message
    streamable:
      mcpEndpoint: /mcp
    promptSupport: true
    resourceSupport: true
    # Query limits the maximum time interval, The unit is milliseconds
    query:
      max_query_duration: 86400000
    auth:
      enabled: false

  # Business data source configuration
  businessDataSources:
    sepsisDatabase:
      enabled: true
