server:
  port: 50180

---

spring:
  application:
    name: seata-test-native-server

---

spring:
  datasource:
    driver-class-name: ${DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/${DATASOURCE_DB:seata_test_native}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: false
    show-sql: true

---

spring:
  sql:
    init:
      # Disabled because schema.sql and data.sql are executed early via
      # EarlyDatabaseInitializer (a BeanFactoryPostProcessor) to ensure
      # the undo_log table exists before Seata's DataSourceProxy checks for it.
      mode: never

---

seata:
  config:
    type: file
  registry:
    type: file
  tx-service-group: default_tx_group
  data-source-proxy-mode: AT
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}
