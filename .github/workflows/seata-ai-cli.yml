name: Seata AI CLI foundation
on:
  pull_request:
    paths:
      - 'tools/seata-ai-cli/**'
      - '.github/workflows/seata-ai-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22.13.0', '24.19.0']
    defaults:
      run:
        working-directory: tools/seata-ai-cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tools/seata-ai-cli/npm-shrinkwrap.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify isolated toolchain
        run: |
          npm install --global --ignore-scripts npm@11.17.0
          node --version
          npm --version
      - name: Install pinned development dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install -r test/requirements.txt
      - name: Typecheck, protocol and fault tests
        run: npm test
      - name: Independent Python contracts
        run: npm run test:contract:python
      - name: Install and verify the actual tarball
        run: npm run test:install
      - name: Check all CLI runtime dependency licenses
        if: matrix.node == '22.13.0'
        run: |
          archive="$RUNNER_TEMP/skywalking-license-eye.tgz"
          curl --fail --silent --show-error --location --retry 3 -o "$archive" \
            https://github.com/apache/skywalking-eyes/releases/download/v0.9.0/skywalking-license-eye-0.9.0-bin.tgz
          echo "e312511e0c28ba5508ee0dbeb64ec20a9d202b6eaf2aa6dc365f27488a37fda6  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" --strip-components=3 \
            skywalking-license-eye-0.9.0-bin/bin/linux/license-eye
          node scripts/check-dependency-licenses.mjs "$RUNNER_TEMP/license-eye"
