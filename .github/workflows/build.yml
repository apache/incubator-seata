name: "build"

on:
  push:
    branches: [ 2.x, develop, master ]
  pull_request:
    branches: [ 2.x, develop, master ]
    types: [opened, reopened, synchronize]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-raft-changes:
    name: "detect-raft-changes"
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      raft: ${{ steps.filter.outputs.raft }}
    steps:
      - name: "Detect raft-related changes"
        id: filter
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.request

          api_url = os.environ["GITHUB_API_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          token = os.environ["GITHUB_TOKEN"]
          output_path = os.environ["GITHUB_OUTPUT"]
          prefixes = (
              "server/",
              "discovery/",
              "distribution/",
              "test-suite/",
              "script/",
              ".github/workflows/",
          )

          page = 1
          raft_changed = False
          while True:
              request = urllib.request.Request(
                  f"{api_url}/repos/{repository}/pulls/{pr_number}/files?per_page=100&page={page}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  files = json.load(response)
              if not files:
                  break
              if any(file_info["filename"].startswith(prefixes) for file_info in files):
                  raft_changed = True
                  break
              page += 1

          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"raft={'true' if raft_changed else 'false'}\n")
          PY

  # job 1: Test based on java 8, 17, 21 and 25.
  build:
    name: "build"
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
      nacos:
        image: nacos/nacos-server:v2.4.2
        ports:
          - 8848:8848
          - 9848:9848
        env:
          MODE: standalone
          SPRING_SECURITY_ENABLED: false
        options: --health-cmd="curl -f http://localhost:8848/nacos" --health-interval=10s --health-timeout=5s --health-retries=3 --health-start-period=30s
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ 8, 17, 21, 25 ]
    steps:
      # step 1
      - name: "Checkout"
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      # step 2
      - name: "Use Python 3.x"
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'
      # step 3
      - name: "Set up Java JDK"
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
      # step 4
      - name: "Print maven version"
        run: ./mvnw -version
      # step 5
      - name: "Restore local maven repository cache"
        uses: actions/cache/restore@v4
        id: cache-maven-repository
        with:
         path: ~/.m2/repository
         key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ env.TODAY }}
         restore-keys: |
           ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
           ${{ runner.os }}-maven-
      # step 6.1：Support GitHub Actions, local shell
      - name: Checkstyle
        if: matrix.java == '25'
        run: |
          GITHUB_BASE_REF=${GITHUB_BASE_REF:-2.x}
          echo "GITHUB_BASE_REF: $GITHUB_BASE_REF"
          if [ "$GITHUB_ACTIONS" = "true" ]; then
            PR_HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            PR_HEAD_SHA=""
          fi
          HEAD_SHA=${PR_HEAD_SHA:-HEAD}
          echo "Pull Request Head SHA: $HEAD_SHA"
          export CHANGED_FILES=$(git diff --name-only --diff-filter=AM origin/$GITHUB_BASE_REF...$HEAD_SHA)
          echo "CHANGED_FILES: $CHANGED_FILES"
          export CHECKSTYLE_INCLUDES=$(echo "$CHANGED_FILES" | grep '\.java$' | sed -e 's#.*src/main/java/##g' -e 's#.*src/test/java/##g' | tr '\n' ',')
          echo "CHECKSTYLE_INCLUDES: $CHECKSTYLE_INCLUDES"
          mvn -T 4C -e -B clean checkstyle:check -Dcheckstyle.skip=false -Dcheckstyle.includes=$CHECKSTYLE_INCLUDES
      # step 6.2
      - name: "Test, Check license with Maven and Java8"
        if: matrix.java == '8'
        run: |
          ./mvnw -T 4C clean test \
                 -Dlicense.skip=false -DredisCaseEnabled=true -DnacosCaseEnabled=true \
                 -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
      # step 6.3
      - name: "Test with Maven and Java${{ matrix.java }}"
        if: matrix.java != '8'
        run: |
          ./mvnw -T 4C clean test \
                 -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn;
      # step 7
      - name: "Save local maven repository cache"
        uses: actions/cache/save@v4
        if: steps.cache-maven-repository.outputs.cache-hit != 'true'
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ env.TODAY }}
      # step 8
      - name: "Codecov"
        if: matrix.java == '8'
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v0.6.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # job 2: Build and Release on 'arm64v8/ubuntu' OS (Skip tests).
  build_arm64-binary:
    runs-on: ubuntu-24.04-arm
    if: ${{ github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'snapshot' || github.ref_name == '2.x') }}
    strategy:
      fail-fast: false
    steps:
      # step 1
      - name: "Checkout"
        uses: actions/checkout@v3
      # step 2
      - name: "Set up Java JDK 25"
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'zulu'
          java-version: 25
      # step 4
      - name: "Print maven version"
        run: ./mvnw -version
      # step 3
      - name: "Build with Maven on 'ubuntu:24.04-arm' OS (Skip tests)"
        run: |
          ./mvnw -T 4C clean install \
              -Prelease-seata \
              -DskipTests \
              -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

  raft-current-server-current-client:
    name: "raft-current-server-current-client"
    needs: detect-raft-changes
    if: ${{ github.event_name == 'pull_request' && needs.detect-raft-changes.outputs.raft == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v3
      - name: "Set raft workspace"
        run: echo "RAFT_WORKSPACE=${RUNNER_TEMP}/raft-current-server-current-client" >> "$GITHUB_ENV"
      - name: "Set up Java JDK 25"
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'zulu'
          java-version: 25
          cache: 'maven'
      - name: "Prepare scripts"
        run: chmod +x ./script/ci/raft-cluster.sh
      - name: "Build current server-only distribution"
        run: |
          ./mvnw -pl distribution -am -Prelease-seata-server -DskipTests package \
                 -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
          echo "SEATA_CURRENT_SERVER_ARCHIVE=$(ls distribution/target/apache-seata-server-*-bin.tar.gz | head -n 1)" >> "$GITHUB_ENV"
      - name: "Start current raft cluster"
        run: |
          ./script/ci/raft-cluster.sh start \
            --distribution "$SEATA_CURRENT_SERVER_ARCHIVE" \
            --workspace "$RAFT_WORKSPACE" \
            --env-file "$GITHUB_ENV"
      - name: "Run current client raft compatibility test"
        run: |
          ./mvnw -pl test-suite/test-new-version -am \
                 -DfailIfNoTests=false -Dtest=ExternalRaftClusterIT test \
                 -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
      - name: "Stop current raft cluster"
        if: always()
        run: ./script/ci/raft-cluster.sh stop --workspace "$RAFT_WORKSPACE"
      - name: "Upload current/current raft logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raft-current-server-current-client-logs
          path: ${{ env.RAFT_WORKSPACE }}
          if-no-files-found: ignore

  raft-previous-server-current-client:
    name: "raft-previous-server-current-client"
    needs: detect-raft-changes
    if: ${{ github.event_name == 'pull_request' && needs.detect-raft-changes.outputs.raft == 'true' }}
    runs-on: ubuntu-latest
    env:
      SEATA_PREVIOUS_RAFT_VERSION: 2.6.0
    steps:
      - name: "Checkout"
        uses: actions/checkout@v3
      - name: "Set raft workspace"
        run: echo "RAFT_WORKSPACE=${RUNNER_TEMP}/raft-previous-server-current-client" >> "$GITHUB_ENV"
      - name: "Set up Java JDK 25"
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'zulu'
          java-version: 25
          cache: 'maven'
      - name: "Prepare scripts"
        run: chmod +x ./script/ci/raft-cluster.sh
      - name: "Start previous stable raft cluster"
        run: |
          ./script/ci/raft-cluster.sh start \
            --distribution "$SEATA_PREVIOUS_RAFT_VERSION" \
            --workspace "$RAFT_WORKSPACE" \
            --readiness-mode tcp \
            --env-file "$GITHUB_ENV"
      - name: "Run current client against previous raft server"
        run: |
          ./mvnw -pl test-suite/test-new-version -am \
                 -DfailIfNoTests=false -Dtest=PreviousServerCurrentClientCompatibilityIT test \
                 -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
      - name: "Stop previous raft cluster"
        if: always()
        run: ./script/ci/raft-cluster.sh stop --workspace "$RAFT_WORKSPACE"
      - name: "Upload previous/current raft logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raft-previous-server-current-client-logs
          path: ${{ env.RAFT_WORKSPACE }}
          if-no-files-found: ignore

  raft-current-server-previous-client:
    name: "raft-current-server-previous-client"
    needs: detect-raft-changes
    if: ${{ github.event_name == 'pull_request' && needs.detect-raft-changes.outputs.raft == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v3
      - name: "Set raft workspace"
        run: echo "RAFT_WORKSPACE=${RUNNER_TEMP}/raft-current-server-previous-client" >> "$GITHUB_ENV"
      - name: "Set up Java JDK 25"
        uses: actions/setup-java@v3.12.0
        with:
          distribution: 'zulu'
          java-version: 25
          cache: 'maven'
      - name: "Prepare scripts"
        run: chmod +x ./script/ci/raft-cluster.sh
      - name: "Build current server-only distribution"
        run: |
          ./mvnw -pl distribution -am -Prelease-seata-server -DskipTests package \
                 -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
          echo "SEATA_CURRENT_SERVER_ARCHIVE=$(ls distribution/target/apache-seata-server-*-bin.tar.gz | head -n 1)" >> "$GITHUB_ENV"
      - name: "Start current raft cluster"
        run: |
          ./script/ci/raft-cluster.sh start \
            --distribution "$SEATA_CURRENT_SERVER_ARCHIVE" \
            --workspace "$RAFT_WORKSPACE" \
            --env-file "$GITHUB_ENV"
      - name: "Run previous stable client against current raft server"
        run: |
          ./mvnw -pl test-suite/test-previous-version -am \
                 -DfailIfNoTests=false -Dtest=PreviousVersionRaftCompatibilityIT test \
                 -e -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
      - name: "Stop current raft cluster"
        if: always()
        run: ./script/ci/raft-cluster.sh stop --workspace "$RAFT_WORKSPACE"
      - name: "Upload current/previous raft logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raft-current-server-previous-client-logs
          path: ${{ env.RAFT_WORKSPACE }}
          if-no-files-found: ignore
