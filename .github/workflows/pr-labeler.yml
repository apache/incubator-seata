name: Label PR by Title

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Only inspect PR metadata; never check out or execute PR code here.
      - name: Add label matching PR title
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const match = pr.title.trim().match(
              /^(bugfix|docs|test|optimize|feature|refactor)(?:\([^)]*\))?\s*:/i
            );
            if (!match) {
              core.info('PR title does not match a supported type.');
              return;
            }

            const labels = {
              bugfix: 'type: bug',
              docs: 'type: docs',
              test: 'type: test',
              optimize: 'type: optimize',
              feature: 'type: feature',
              refactor: 'type: refactor',
            };
            const label = labels[match[1].toLowerCase()];
            if (pr.labels.some(existing => existing.name === label)) {
              core.info(`PR already has label "${label}".`);
              return;
            }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: pr.number,
              labels: [label],
            });
